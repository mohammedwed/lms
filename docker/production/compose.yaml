name: simple-lms

services:
  backend:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  configurator:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    restart: "no"
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host mariadb;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    restart: "no"
    depends_on:
      - configurator
    command:
      - >
        bench new-site ${SITE_NAME} --no-mariadb-socket --mariadb-root-password ${DB_ROOT_PASSWORD} --admin-password ${ADMIN_PASSWORD} --install-app lms;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  frontend:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8080:8080"

  websocket:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      - redis-queue
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-default:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    command:
      - bench
      - worker
      - --queue
      - default
    depends_on:
      - backend
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-short:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    command:
      - bench
      - worker
      - --queue
      - short
    depends_on:
      - backend
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  queue-long:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    command:
      - bench
      - worker
      - --queue
      - long
    depends_on:
      - backend
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  scheduler:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    command:
      - bench
      - schedule
    depends_on:
      - backend
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - db-data:/var/lib/mysql

  redis-queue:
    image: redis:alpine
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:alpine
    volumes:
      - redis-cache-data:/data

volumes:
  db-data:
  redis-queue-data:
  redis-cache-data:
  sites:
  logs:
